<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Sound + Video Player</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
  <video id="myVideo" src="media/video.mp4" loop muted></video>
<img id="playBtn" src="images/play.png" alt="Play" class="control-btn">
<img id="pauseBtn" src="images/pause.png" alt="Pause" class="control-btn">
<audio id="myAudio" src="media/audio.mp3" loop></audio>


  </div>

  <script src="script.js"></script>
</body>
</html>
